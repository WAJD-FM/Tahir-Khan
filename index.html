*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#06122B}
body{min-height:100vh;min-height:100dvh;font-family:Cairo,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:flex-start;padding:0;background:
 radial-gradient(900px 600px at 15% -10%,rgba(10,77,176,.55),transparent 60%),
 radial-gradient(800px 600px at 100% 100%,rgba(11,143,110,.45),transparent 55%),#06122B;overflow-x:hidden}
.card{position:relative;width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#fff;overflow:hidden}
@media(min-width:520px){body{padding:36px 16px;align-items:center}.card{min-height:0;border-radius:34px;box-shadow:0 40px 90px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}}

.hero .sq{position:absolute;z-index:-1;border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08)}
.sq.a{width:150px;height:150px;right:-40px;top:96px;transform:rotate(14deg)}
.sq.b{width:96px;height:96px;left:-30px;bottom:30px;transform:rotate(-12deg)}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{height:34px;display:block}
.tag{font-size:9.5px;font-weight:800;letter-spacing:2.6px;color:var(--mint);text-transform:uppercase}
.id{display:flex;gap:18px;align-items:center;margin-top:34px}
.av{flex:none;width:92px;height:92px;border-radius:28px;padding:3px;background:conic-gradient(from 210deg,var(--mint),#2f7bff,var(--mint));box-shadow:0 14px 34px -8px rgba(45,212,166,.6)}
.av>div{width:100%;height:100%;border-radius:25px;background:linear-gradient(150deg,#0e3a8f,#0B2762);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;letter-spacing:1px;color:#fff;position:relative;overflow:hidden}
.av>div img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.av>div:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.5s 1.2s infinite}
@keyframes sheen{to{transform:translateX(120%)}}
.nm{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.2px}
.ti{margin-top:7px;font-size:10.5px;line-height:1.5;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mint)}
.co{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:13px;line-height:1.5;color:rgba(255,255,255,.78);font-weight:400}
.co b{color:#fff;font-weight:600}
/* SHEET */
.sheet{position:relative;margin-top:-34px;background:#fff;border-radius:30px 30px 0 0;padding:30px 22px 26px;flex:1;display:flex;flex-direction:column}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;transform:translateY(-34px);margin-bottom:0}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 11px;border-radius:20px;background:#fff;color:var(--navy);text-decoration:none;font-size:11.5px;font-weight:800;box-shadow:0 14px 30px -12px rgba(11,39,98,.45),0 0 0 1px var(--line);transition:transform .2s,box-shadow .2s}
.act:active{transform:scale(.96)}
.act i{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;background:linear-gradient(145deg,var(--blue),var(--deep))}
.act:nth-child(2) i{background:linear-gradient(145deg,#19c37d,var(--green))}
.act:nth-child(3) i{background:linear-gradient(145deg,#2f7bff,var(--blue))}
.act:nth-child(4) i{background:linear-gradient(145deg,#0B8F6E,#0A4DB0)}
.lab{font-size:10px;font-weight:800;letter-spacing:2.4px;color:var(--green);margin:0 2px 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;background:var(--soft);text-decoration:none;color:inherit;border:1px solid transparent;transition:border-color .2s,transform .2s}
.row .main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-decoration:none;color:inherit}
.row .wa{flex:none;width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#19c37d,var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;box-shadow:0 10px 20px -8px rgba(11,143,110,.7)}
.row:active{transform:scale(.99);border-color:var(--line)}
.row i{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 0 1px var(--line)}
.row small{display:block;font-size:10.5px;font-weight:600;color:var(--mute);letter-spacing:.4px}
.row span{display:block;font-size:14.5px;font-weight:600;color:var(--navy);word-break:break-word;line-height:1.35}
.cta{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:18px}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:14.5px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.p{color:#fff;background:linear-gradient(110deg,var(--green),var(--blue));box-shadow:0 16px 30px -12px rgba(10,77,176,.7)}
.btn.p:after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-140px) skewX(-20deg);animation:shine 3.6s 1.6s infinite}
@keyframes shine{to{transform:translateX(420px) skewX(-20deg)}}
.btn.s{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--line)}
/* QR */
.qr{margin-top:18px;display:flex;align-items:center;gap:18px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#0B2762,#0A3C9A);color:#fff;cursor:pointer;border:0;font:inherit;text-align:left;width:100%;position:relative;overflow:hidden}
.qr:before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:34px;background:rgba(255,255,255,.06);transform:rotate(16deg)}
.qrb{flex:none;width:104px;height:104px;background:#fff;border-radius:16px;padding:9px;position:relative}
.qrb svg{width:100%;height:100%;display:block}
.qr h4{font-size:15px;font-weight:800;line-height:1.3}
.qr p{font-size:12px;line-height:1.5;color:rgba(255,255,255,.75);margin-top:4px}
.qr em{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--mint)}
.foot{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;align-items:center;gap:9px}
.foot img{height:30px}
.foot p{font-size:11px;color:var(--mute);letter-spacing:.3px}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,18,43,.82);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex;animation:fade .25s}
.mc{position:relative;background:#fff;border-radius:28px;padding:56px 26px 22px;width:100%;max-width:340px;text-align:center}
.mc .q{width:100%;aspect-ratio:1;padding:6px}
.mc .q svg{width:100%;height:100%}
.mc h4{margin-top:12px;font-size:17px;font-weight:800;color:var(--navy)}
.mc p{font-size:12px;color:var(--mute);margin-top:3px}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.toast{white-space:nowrap;max-width:92vw;position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;z-index:60;background:var(--navy);color:#fff;font-weight:600;font-size:13px;padding:12px 18px;border-radius:99px;display:flex;gap:9px;align-items:center;box-shadow:0 14px 34px -8px rgba(0,0,0,.5);transition:.35s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{color:var(--mint)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rv{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.nm{font-size:23px}.av{width:78px;height:78px}.act{font-size:10.5px}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:18px 16px 16px;border-radius:22px;text-decoration:none;color:#fff;position:relative;overflow:hidden;background:linear-gradient(145deg,#0A4DB0,#003080);box-shadow:0 16px 30px -14px rgba(10,77,176,.75);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile:before{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:28px;background:rgba(255,255,255,.10);transform:rotate(16deg)}
.tile i{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px;position:relative}
.tile b{font-size:17px;font-weight:800;line-height:1.2;position:relative}
.tile small{font-size:11.5px;font-weight:400;color:rgba(255,255,255,.78);position:relative}
.tile.wa{background:linear-gradient(145deg,#19c37d,#0B8F6E);box-shadow:0 16px 30px -14px rgba(11,143,110,.8)}
.tile.em{background:linear-gradient(145deg,#2f7bff,#0A4DB0)}
.tile.web{background:linear-gradient(145deg,#0B2762,#0A3C9A);box-shadow:0 16px 30px -14px rgba(11,39,98,.8)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.quick .web i{background:linear-gradient(145deg,#0B2762,#0A3C9A)}
